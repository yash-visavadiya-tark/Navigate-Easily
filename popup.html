<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Same dark surface and accent as the in-page palette, so the two read as one product. */
  :root {
    --bg: #1e1e1e; --surface: #2a2a2a; --border: #444; --divider: #333;
    --text: #eee; --text-muted: #a8a8a8; --mono: #9ab; --accent: #3a5ccc; --accent-text: #8fa7ff;
    --success: #6fcf8f; --error: #ff8a8a;
  }
  body { width: 320px; margin: 0; padding: 14px 16px 12px; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  h2 { font-size: 11px; margin: 0 0 8px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .05em; }
  section { border-top: 1px solid var(--divider); padding: 12px 0; }
  section:last-of-type { padding-bottom: 0; }
  .version { font-size: 11px; color: var(--text-muted); }
  .caption { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .caption.error { color: var(--error); }
  .empty { font-size: 12px; color: var(--text-muted); }

  :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

  .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .setting-title { font-weight: 500; }
  .switch { appearance: none; flex-shrink: 0; position: relative; width: 34px; height: 20px; margin: 0;
    border-radius: 10px; background: var(--border); cursor: pointer; transition: background .15s; }
  .switch::before { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(14px); }

  #shortcutBtn { display: flex; align-items: center; gap: 4px; width: 100%; min-height: 34px; padding: 6px 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text);
    font: inherit; cursor: pointer; transition: border-color .15s; }
  #shortcutBtn:hover { border-color: #666; }
  #shortcutBtn.recording { border-color: var(--accent); color: var(--accent-text); }
  kbd { padding: 1px 6px; background: var(--bg); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; font: 12px ui-monospace, monospace; }
  .plus { color: var(--text-muted); font-size: 11px; }
  .caption-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .link { padding: 0; background: none; border: none; color: var(--accent-text); font: inherit; font-size: 11.5px;
    cursor: pointer; white-space: nowrap; }
  .link:hover { text-decoration: underline; }

  .origin { display: inline-block; max-width: 100%; margin-bottom: 8px; padding: 2px 6px; background: var(--surface);
    border-radius: 4px; font: 11.5px ui-monospace, monospace; color: var(--mono); overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .row label { min-width: 90px; font: 12px ui-monospace, monospace; color: var(--mono); }
  .row input { flex: 1; min-width: 0; padding: 6px 8px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: #fff; font: inherit; }
  .row input:focus-visible { outline: none; border-color: var(--accent-text); }
  .saved { width: 48px; flex-shrink: 0; font-size: 11px; color: var(--success); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <h1>Navigate Easily</h1>
    <span class="version" id="version"></span>
  </header>

  <section>
    <label class="setting" for="autoDiscover">
      <span>
        <span class="setting-title">Auto-discover routes</span>
        <span class="caption">Applies to all sites. When off, the palette shows only pages you've visited.</span>
      </span>
      <input type="checkbox" role="switch" class="switch" id="autoDiscover">
    </label>
  </section>

  <section>
    <h2 id="shortcutHeading">Open shortcut</h2>
    <button id="shortcutBtn" type="button" aria-labelledby="shortcutHeading shortcutBtn"
      aria-describedby="shortcutHelp"></button>
    <div class="caption-row">
      <span class="caption" id="shortcutHelp" aria-live="polite"></span>
      <button id="resetShortcut" type="button" class="link" hidden>Reset to default</button>
    </div>
  </section>

  <section id="paramsSection">
    <h2>Route params</h2>
    <div id="content"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
