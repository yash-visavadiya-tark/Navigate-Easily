<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #1e1e1e; color: #eee; }
  h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  h2 { font-size: 12px; margin: 0 0 4px; font-weight: 600; color: #ddd; }
  .origin { font-family: monospace; font-size: 11px; color: #9ab; margin-bottom: 10px; word-break: break-all; }
  .empty { font-size: 12px; color: #999; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row label { font-family: monospace; font-size: 12px; color: #9ab; min-width: 90px; }
  .row input { flex: 1; padding: 5px 7px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
  .caption { font-size: 10px; color: #777; margin-top: -4px; margin-bottom: 10px; }
  .section { border-top: 1px solid #333; padding-top: 10px; margin-top: 10px; }
  .toggle { display: flex; align-items: center; gap: 8px; }
  .toggle input { width: 15px; height: 15px; }
  .toggle label { font-size: 12px; color: #ddd; }
  .shortcut { margin-top: 10px; }
  #shortcutBtn { width: 100%; padding: 7px 9px; background: #2a2a2a; border: 1px solid #444; color: #fff;
    border-radius: 4px; font-size: 12px; font-family: monospace; cursor: pointer; text-align: left; }
  #shortcutBtn.recording { border-color: #3a5ccc; color: #9ab; }
  #resetShortcut { font-size: 10px; color: #6a8; cursor: pointer; margin-top: 4px; display: inline-block; }
</style>
</head>
<body>
  <h1>Navigate Easily</h1>

  <div class="toggle">
    <input type="checkbox" id="autoDiscover">
    <label for="autoDiscover">Auto-discover routes</label>
  </div>
  <div class="caption">Applies to all sites. When off, the palette shows only routes you've visited.</div>

  <div class="shortcut">
    <h2>Open shortcut</h2>
    <button id="shortcutBtn" type="button"></button>
    <div class="caption">Click, then press the key combo. Opens the route palette on any site.</div>
    <span id="resetShortcut">Reset to default (Ctrl / ⌘ + K)</span>
  </div>

  <div class="section" id="paramsSection">
    <h2>Route params</h2>
    <div class="origin" id="origin"></div>
    <div id="content"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
